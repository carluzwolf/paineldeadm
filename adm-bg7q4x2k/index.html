cinema,movie,film,série,serie,atriz,papel,netflix,redoma,bell jar"}, {"slug": "musica", "label": "Música", "keywords": "álbum,album,single,música,musica,song,lançamento,clipe,faixa,canção,streaming,new music"}, {"slug": "ativismo", "label": "Ativismo e política", "keywords": "ativis,clima,ambient,política,politica,lula,eleiç,imigra,protest,climate"}, {"slug": "familia", "label": "Família e vida pessoal", "keywords": "finneas,irmão,casamento,namor,família,familia,wedding,boyfriend"}, {"slug": "visual", "label": "Visual e moda", "keywords": "cabelo,visual,look,moda,fashion,hair,vestido,outfit,estilo"}, {"slug": "redes", "label": "Redes sociais", "keywords": "instagram,tiktok,redes sociais,viral,fãs reag"}]};

const LS="bgbr_admin_v1",API="https://api.github.com";
let S=Object.assign({repo:"carluzwolf/sitebillieglobalbr",branch:"main",token:""},JSON.parse(localStorage.getItem(LS)||"{}"));

function ptDate(d){const m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];return d.getDate()+" "+m[d.getMonth()]+" "+d.getFullYear()}

/* ---------- GitHub ---------- */
async function gh(path,opt={}){const r=await fetch(API+path,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{}),cache:"no-store"}));
 if(!r.ok){const t=await r.text();const e=new Error(r.status+" "+t.slice(0,180));e.status=r.status;throw e}return r}
async function fileSha(path){const i=path.lastIndexOf("/"),dir=i>0?path.slice(0,i):"",name=path.slice(i+1);
 try{const l=await(await gh(`/repos/${S.repo}/contents${dir?"/"+dir:""}?ref=${S.branch}`)).json();const f=l.find(x=>x.name===name);return f?f.sha:null}catch(e){if(e.status===404)return null;throw e}}

function b64(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+8000));return btoa(s)}
async function writeFile(path,content,sha,msg,isB64){const body={message:msg,content:isB64?content:b64(content),branch:S.branch};if(sha)body.sha=sha;
 const r=await gh(`/repos/${S.repo}/contents/${path}`,{method:"PUT",body:JSON.stringify(body)});return r.json()}
async function mutate(path,fn,msg,def){for(let t=0;t<3;t++){const text=await readText(path),sha=text==null?null:await fileSha(path);let data;try{data=text?JSON.parse(text):clone(def)}catch(e){data=clone(def)}
 const out=fn(data);try{await writeFile(path,JSON.stringify(out,null,1),sha,msg);return out}catch(e){if(t<2&&(e.status===409||e.status===422))continue;throw e}}}
function imgSrc(p){if(!p)return"";if(/^(https?:|data:)/.test(p))return p;if(CACHE[p])return CACHE[p];return `https://raw.githubusercontent.com/${S.repo}/${S.branch}/${p.replace(/^\//,"")}`}
async function prep(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const keepPng=file.type==="image/png"&&file.size<1500000;
 if(keepPng||file.type==="image/gif"||file.type==="image/webp"&&file.size<1500000){return res({data:fr.result,ext:keepPng?"png":file.type.split("/")[1]})}
 let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res({data:c.toDataURL("image/jpeg",.86),ext:"jpg"})};
 im.onerror=()=>rej(new Error("Imagem inválida"));im.src=fr.result};fr.onerror=()=>rej(new Error("Falha ao ler"));fr.readAsDataURL(file)})}
function pickImage(){return new Promise(ok=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{const f=i.files[0];if(!f)return ok(null);

 await writeFile(path,p.data.split(",")[1],null,"Painel: envia imagem",true);CACHE[path]=p.data;busy(false);toast("Imagem enviada ✓");ok(path)}catch(e){busy(false);toast("Falha no envio: "+e.message,1);ok(null)}};i.click()})}

/* ---------- blocks ---------- */
function toBlocks(arr){return(arr||[]).map(x=>{x=String(x==null?"":x);let m=x.match(/^\[img:([^|\]]+)(?:\|([^\]]*))?\]$/);if(m)return{k:"i",url:m[1],cap:m[2]||""};if(/^##\s/.test(x))return{k:"h",v:x.slice(3)};return{k:"p",v:x}})}

 return h+`<div class="row"><button class="btn o s" data-bl="${id}" data-act="addp">+ Parágrafo</button><button class="btn o s" data-bl="${id}" data-act="addh">+ Subtítulo</button><button class="btn o s" data-bl="${id}" data-act="addi">+ Imagem (enviar)</button><button class="btn o s" data-bl="${id}" data-act="addu">+ Imagem (link)</button></div>`}
async function blockAct(id,act,i){const b=BLK[id];i=+i;
 if(act==="up"&&i>0)[b[i-1],b[i]]=[b[i],b[i-1]];else if(act==="dn"&&i<b.length-1)[b[i+1],b[i]]=[b[i],b[i+1]];else if(act==="del"){if(confirm("Remover este bloco?"))b.splice(i,1)}

 ${field("Fonte / autor (nome que aparece)","E","s")}${E.manual?"":field("Link da matéria original","E","u","url")}${field("Data (texto exibido)","E","date")}</div>
 <div class="card"><b>Imagem de capa</b>${E.img?`<img class="pv" src="${esc(imgSrc(E.img))}" alt="">`:`<div class="msg" style="margin-top:8px">Sem imagem de capa.</div>`}
 <div class="row"><button class="btn o s" data-act="cover">${E.img?"Trocar imagem":"Enviar imagem"}</button><button class="btn g s" data-act="coverurl">Usar link</button>${E.img?'<button class="btn g s" data-act="coverdel">Remover</button>':""}</div>
 ${field("Crédito da foto (opcional)","E","imgc")}</div>
 <div class="card"><b>Texto da notícia</b><p style="font-size:12px;color:var(--mut);margin:4px 0 0">Coloque imagens entre os parágrafos com “+ Imagem”. Colar vários parágrafos de uma vez numa caixa divide automaticamente.</p>${blocksUI("body")}</div>
 <div class="card">${chk("📌 Fixar no começo do site","E","pin")}${chk("🔒 Travar (o robô não altera esta notícia)","E","locked")}${chk("🙈 Esconder do site","E","hide")}</div>
 <div class="row f"><button class="btn" data-act="save">Salvar e publicar</button><button class="btn g" data-act="cancel">Cancelar</button></div>`;
 if(!isNew&&!E.manual)h+=`<div class="row"><button class="btn o s" data-act="redo">↻ Mandar a IA reescrever de novo</button></div>`;return h}
function vPages(){const s=SITE;let h=`<h2>Páginas e configurações</h2><div class="msg">Tudo aqui vale para o site inteiro. Clique em “Salvar e publicar” no fim.</div>
 <div class="card"><b>Identidade</b>${field("Nome (parte branca)","SITE","name")}${field("Sufixo (parte vermelha)","SITE","suffix")}${field("Título da lista da página inicial","SITE","homeTitle")}${field("Texto do rodapé","SITE","footer")}</div>
 <div class="card"><b>Banner do topo</b><img class="pv" src="${esc(imgSrc(s.banner))}" alt=""><div class="row"><button class="btn o s" data-act="banner">Trocar banner</button><button class="btn g s" data-act="bannerurl">Usar link</button></div>${field("Texto alternativo","SITE","bannerAlt")}</div>
 <div class="card"><b>Links e botões</b>${field("Link do grupo de WhatsApp","SITE","links.grupo","url")}${field("Texto do botão do grupo","SITE","ctaGrupo")}${field("Link do canal de WhatsApp","SITE","links.canal","url")}${field("Texto do botão do canal","SITE","ctaCanal")}</div>`;
 [["sobre","Página Sobre"],["canal","Página Canal de WhatsApp"],["grupo","Página Grupo de WhatsApp"]].forEach(([k,t])=>{h+=`<div class="card"><b>${t}</b>${field("Título","SITE",k+".title")}${k==="sobre"?"":field("Texto do botão","SITE",k+".button")}${blocksUI(k)}</div>`});
 h+=`<div class="card"><b>Categorias</b><p style="font-size:12px;color:var(--mut);margin:4px 0 0">A notícia vai para a primeira categoria (de cima para baixo) cujas palavras aparecem no título ou resumo. Separe as palavras por vírgula.</p>`;
 s.cats.forEach((c,i)=>{h+=`<div class="blk"><div class="t"><span>${esc(c.label||"nova")}</span><span class="tools"><button class="btn g s" data-act="catup" data-i="${i}">↑</button><button class="btn g s" data-act="catdn" data-i="${i}">↓</button><button class="btn g s" data-act="catdel" data-i="${i}">✕</button></span></div>${field("Nome","SITE","cats."+i+".label")}${field("Identificador (sem espaços)","SITE","cats."+i+".slug")}${area("Palavras-chave","SITE","cats."+i+".keywords")}</div>`});
 h+=`<div class="row"><button class="btn o s" data-act="catadd">+ Nova categoria</button></div></div><div class="row f"><button class="btn" data-act="savesite">Salvar e publicar</button></div>`;return h}
function vBot(){const c=CONF;let h=`<h2>Robô de notícias e IA</h2><div class="msg">Estas opções valem na <b>próxima rodada</b> do robô (a cada 30 minutos, ou ao clicar em “Atualizar agora” em Ferramentas).</div>
 <div class="card"><b>Geral</b>${chk("IA ligada (reescrever e traduzir as notícias)","CONF","ai_enabled")}${field("Notícias reescritas por rodada","CONF","max_rewrite","number")}${field("Máximo de notícias guardadas","CONF","max_items","number")}${field("Palavras que a notícia precisa ter (vírgula)","CONF","keyword")}</div>
 <div class="card"><b>Modelos de IA</b>${field("Modelo principal (Gemini)","CONF","gemini_model")}${field("Modelos reserva (vírgula)","CONF","gemini_fallbacks")}${field("Modelo da OpenAI (se usar ChatGPT)","CONF","openai_model")}</div>
 <div class="card"><b>Buscas de notícias</b>`;
 c.queries.forEach((q,i)=>{h+=`<div class="blk"><div class="t"><span>Busca ${i+1}</span><button class="btn g s" data-act="qdel" data-i="${i}">✕</button></div>${field("Termo","CONF","queries."+i+".q")}<label>Idioma</label><select data-o="CONF" data-p="queries.${i}.lang">${["pt-BR","en-US","es-ES","fr-FR"].map(l=>`<option${q.lang===l?" selected":""}>${l}</option>`).join("")}</select></div>`});
 h+=`<div class="row"><button class="btn o s" data-act="qadd">+ Nova busca</button></div></div>
 <div class="card"><b>Instruções para a IA</b><p style="font-size:12px;color:var(--mut);margin:4px 0 0">Aqui você define estilo, tamanho e regras. O formato da resposta (título, resumo e texto) é fixo e adicionado automaticamente.</p>${area("","CONF","prompt","big")}<div class="row"><button class="btn g s" data-act="promptreset">Restaurar instruções padrão</button></div></div>
 <div class="card"><b>Chaves de API</b><p style="font-size:13px;line-height:1.5;margin:6px 0">As chaves (<code>GEMINI_API_KEY</code>, <code>OPENAI_API_KEY</code>) ficam guardadas no GitHub e não podem ser lidas nem exibidas por este painel — é de propósito, por segurança.</p><a class="btn o s" target="_blank" rel="noopener" href="https://github.com/${S.repo}/settings/secrets/actions">Abrir as chaves no GitHub ↗</a></div>
 <div class="row f"><button class="btn" data-act="saveconf">Salvar e publicar</button></div>`;return h}
function vTools(){return `<h2>Ferramentas</h2><div class="card"><b>Robô</b><div class="row f"><button class="btn" data-act="run" data-w="update-news.yml">▶ Atualizar notícias agora</button></div><div class="row f"><button class="btn o" data-act="run" data-w="clean-news.yml">Limpar notícias incompletas</button></div>
 <p style="font-size:12px;color:var(--mut)">A atualização leva alguns minutos. O site publica sozinho depois.</p><a class="btn g s" target="_blank" rel="noopener" href="https://github.com/${S.repo}/actions">Ver execuções ↗</a></div>
 <div class="card"><b>Site</b><div class="row"><a class="btn g s" target="_blank" href="${esc(location.origin)}/">Abrir o site ↗</a><a class="btn g s" target="_blank" rel="noopener" href="https://github.com/${S.repo}">Repositório ↗</a></div></div>
 <div class="card"><b>Backup</b><div class="row"><button class="btn g s" data-act="bk" data-f="news.json">Baixar news.json</button><button class="btn g s" data-act="bk" data-f="site.json">Baixar site.json</button><button class="btn g s" data-act="bk" data-f="config.json">Baixar config.json</button></div></div>
 <div class="card"><b>Conexão</b><p style="font-size:13px;margin:6px 0">Repositório: <code>${esc(S.repo)}</code> (${esc(S.branch)})</p><button class="btn g s" data-act="logout">Sair / trocar chave de acesso</button></div>
 <div class="msg">Este painel só consegue publicar porque o seu navegador guarda a chave de acesso do GitHub. Não compartilhe o endereço do painel nem essa chave.</div>`}
function vSetup(){return `<h2>Conectar ao GitHub</h2><div class="msg">Este painel grava as alterações direto no seu repositório. Para isso precisa de uma <b>chave de acesso</b> (token). Ela fica só neste navegador.</div>
 <details><summary>Como criar a chave</summary><ol><li>No GitHub: foto de perfil → <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b>.</li><li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque o site.</li><li>Em <b>Permissions → Repository permissions</b>: <b>Contents: Read and write</b> e <b>Actions: Read and write</b>.</li><li>Gere, copie o token e cole abaixo.</li></ol></details>
 <div class="card"><label>Repositório (dono/nome)</label><input type="text" id="s_repo" value="${esc(S.repo)}"><label>Branch</label><input type="text" id="s_br" value="${esc(S.branch)}"><label>Chave de acesso (token)</label><input type="password" id="s_tk" value="${esc(S.token)}" placeholder="github_pat_…"><div class="row f"><button class="btn" data-act="connect">Conectar</button></div></div>`}
function render(keep){const y=scrollY;const a=$("#app");
 if(!S.token){a.innerHTML=vSetup();$("#tabs").innerHTML="";$("#who").textContent="";return}
 $("#who").textContent=S.repo.split("/")[1]||"";
 $("#tabs").innerHTML=[["news","📰","Notícias"],["new","✍️","Nova"],["pages","⚙️","Páginas"],["bot","🤖","Robô"],["tools","🧰","Ferramentas"]].map(([k,i,t])=>`<button data-tab="${k}" class="${(tab===k||(tab==="edit"&&k==="news"&&E0)||(tab==="edit"&&k==="new"&&!E0))?"on":""}"><span>${i}</span>${t}</button>`).join("");
 a.innerHTML=tab==="edit"?vEdit():tab==="pages"?vPages():tab==="bot"?vBot():tab==="tools"?vTools():vNews();
 if(keep)scrollTo(0,y);else scrollTo(0,0)}
/* ---------- actions ---------- */
function newItem(){const id="m"+Date.now().toString(36);return{id,manual:true,locked:true,t:"",d:"",s:SITE.name+" "+SITE.suffix,u:"manual:"+id,date:ptDate(new Date()),ts:new Date().toISOString(),img:"",imgc:"",cat:"",body:[],pin:false,hide:false}}
function openEditor(i){if(i==null){E=newItem();E0=null;BLK.body=[{k:"p",v:""}]}else{E=clone(NEWS[i]);E0=NEWS[i].u;if(E.locked==null)E.locked=false;E.locked=true;BLK.body=toBlocks(E.body&&E.body.length?E.body:(E.d?[E.d]:[]));}tab="edit";render()}
async function saveEditor(){if(!(E.t||"").trim())return toast("Dê um título à notícia.",1);
 const item=clone(E);item.body=fromBlocks(BLK.body);item.t=item.t.trim();if(!item.id&&E0){item.id=nid(NEWS.find(n=>n.u===E0).t)}
 if(!item.d&&item.body.length)item.d=item.body.find(x=>!/^(\[img:|##)/.test(x))||"";item.d=item.d||"";
 if(!E0){item.k="manual-"+item.id}
 try{busy(true,"Publicando…");await mutate("news.json",arr=>{if(!Array.isArray(arr))arr=[];if(!E0)arr.unshift(item);else{const i=arr.findIndex(x=>x.u===E0);if(i<0)throw new Error("A notícia não foi encontrada (o robô pode tê-la removido). Recarregue a lista.");arr[i]=Object.assign(arr[i],item)}return arr},"Painel: "+(E0?"edita":"cria")+" notícia");
 await loadAll();tab="news";E=null;E0=null;busy(false);render();toast("Publicado ✓ (o site atualiza em ~1 minuto)")}catch(e){busy(false);toast("Erro ao salvar: "+e.message,1)}}
async function quick(i,act){const n=NEWS[i];if(!n)return;
 if(act==="del"){const manual=n.manual;if(!confirm(manual?"Excluir esta notícia para sempre?":"Excluir? (ela some do site e o robô não traz de volta)"))return}
 try{busy(true,"Salvando…");await mutate("news.json",arr=>{const j=arr.findIndex(x=>x.u===n.u);if(j<0)throw new Error("Notícia não encontrada. Recarregue.");
  if(act==="pin")arr[j].pin=!arr[j].pin;else if(act==="hide")arr[j].hide=!arr[j].hide;else if(act==="del"){if(arr[j].manual)arr.splice(j,1);else arr[j].hide=true}return arr},"Painel: "+act);
  await loadAll();busy(false);render(true);toast("Feito ✓")}catch(e){busy(false);toast("Erro: "+e.message,1)}}
async function saveJson(path,obj,msg){try{busy(true,"Publicando…");await mutate(path,()=>obj,msg,{});busy(false);toast("Publicado ✓ (o site atualiza em ~1 minuto)")}catch(e){busy(false);toast("Erro ao salvar: "+e.message,1)}}
async function runWf(w){try{busy(true,"Iniciando…");await gh(`/repos/${S.repo}/actions/workflows/${w}/dispatches`,{method:"POST",body:JSON.stringify({ref:S.branch})});busy(false);toast("Robô iniciado ✓ Veja o andamento em “Ver execuções”.")}catch(e){busy(false);toast("Não foi possível iniciar: "+e.message+" (a chave precisa da permissão Actions: Read and write)",1)}}
async function setImg(path,pathKey,obj){const p=await pickImage();if(p){setP(obj,pathKey,p);render(true)}}
document.addEventListener("click",async ev=>{
 const t=ev.target.closest("[data-tab],[data-act],[data-bl]");if(!t)return;
 if(t.dataset.tab){const k=t.dataset.tab;if(k==="new"){openEditor(null);return}tab=k;E=null;E0=null;if(k==="pages"){BLK.sobre=toBlocks(SITE.sobre.body);BLK.canal=toBlocks(SITE.canal.body);BLK.grupo=toBlocks(SITE.grupo.body)}render();return}
 if(t.dataset.bl){blockAct(t.dataset.bl,t.dataset.act,t.dataset.i);return}
 const a=t.dataset.act,i=t.dataset.i;
 if(a==="connect"){S.repo=$("#s_repo").value.trim();S.branch=$("#s_br").value.trim()||"main";S.token=$("#s_tk").value.trim();
  try{busy(true,"Conectando…");const r=await(await gh(`/repos/${S.repo}`)).json();localStorage.setItem(LS,JSON.stringify(S));await loadAll();busy(false);render();toast("Conectado a "+r.full_name+" ✓")}catch(e){busy(false);S.token="";toast("Não conectou: "+e.message,1)}return}
 if(a==="logout"){if(confirm("Sair e esquecer a chave neste navegador?")){S.token="";localStorage.setItem(LS,JSON.stringify(S));render()}return}
 if(a==="edit")openEditor(+i);else if(a==="more"){F.lim+=30;render(true)}else if(a==="reload"){await loadAll();render(true)}
 else if(a==="pin"||a==="hide"||a==="del")quick(+i,a);
 else if(a==="cancel"){tab="news";E=null;E0=null;render()}
 else if(a==="save")saveEditor();
 else if(a==="cover"){const p=await pickImage();if(p){E.img=p;render(true)}}
 else if(a==="coverurl"){const u=prompt("Cole o link da imagem (https://...)");if(u){E.img=u.trim();render(true)}}
 else if(a==="coverdel"){E.img="";render(true)}
 else if(a==="redo"){if(!confirm("A IA vai reescrever esta notícia na próxima rodada e o seu texto atual será substituído. Continuar?"))return;
  try{busy(true,"Salvando…");await mutate("news.json",arr=>{const j=arr.findIndex(x=>x.u===E0);if(j<0)throw new Error("Notícia não encontrada");const n=arr[j];n.locked=false;delete n.v;delete n.tries3;delete n.body;return arr},"Painel: pede nova reescrita");await loadAll();busy(false);tab="news";E=null;E0=null;render();toast("Pronto: será reescrita na próxima rodada ✓")}catch(e){busy(false);toast("Erro: "+e.message,1)}}
 else if(a==="banner"){const p=await pickImage();if(p){SITE.banner=p;render(true)}}
 else if(a==="bannerurl"){const u=prompt("Cole o link da imagem (https://...)");if(u){SITE.banner=u.trim();render(true)}}
 else if(a==="catadd"){SITE.cats.push({slug:"nova"+Date.now().toString(36).slice(-3),label:"Nova categoria",keywords:""});render(true)}
 else if(a==="catdel"){if(confirm("Remover categoria?")){SITE.cats.splice(+i,1);render(true)}}
 else if(a==="catup"&&+i>0){const c=SITE.cats;[c[i-1],c[i]]=[c[i],c[i-1]];render(true)}
 else if(a==="catdn"&&+i<SITE.cats.length-1){const c=SITE.cats;[c[+i+1],c[i]]=[c[i],c[+i+1]];render(true)}
 else if(a==="savesite"){const s=clone(SITE);["sobre","canal","grupo"].forEach(k=>s[k].body=fromBlocks(BLK[k]));s.cats.forEach(c=>c.slug=(c.slug||"").toLowerCase().replace(/[^a-z0-9]/g,"")||"cat"+Math.random().toString(36).slice(2,5));await saveJson("site.json",s,"Painel: salva configurações do site");SITE=s}
 else if(a==="saveconf"){await saveJson("config.json",CONF,"Painel: salva configuração do robô")}
 else if(a==="qadd"){CONF.queries.push({q:"",lang:"pt-BR"});render(true)}
 else if(a==="qdel"){CONF.queries.splice(+i,1);render(true)}
 else if(a==="promptreset"){if(confirm("Voltar às instruções padrão?")){CONF.prompt=DEF_CONF.prompt;render(true)}}
 else if(a==="run")runWf(t.dataset.w);
 else if(a==="bk"){const f=t.dataset.f;const x=await readText(f);if(x==null)return toast("Arquivo não existe ainda.",1);const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([x],{type:"application/json"}));l.download=f;l.click()}
});
document.addEventListener("input",ev=>{const t=ev.target;
 if(t.dataset.o){const o=t.dataset.o==="E"?E:t.dataset.o==="SITE"?SITE:CONF;setP(o,t.dataset.p,t.type==="checkbox"?t.checked:t.type==="number"?Number(t.value):t.value)}
 else if(t.dataset.bli){BLK[t.dataset.bli][+t.dataset.i][t.dataset.k]=t.value}
 else if(t.id==="fq"){F.q=t.value;clearTimeout(input.t);input.t=setTimeout(()=>{render(true);const e=$("#fq");e.focus();e.setSelectionRange(e.value.length,e.value.length)},350)}});
function input(){}
document.addEventListener("change",ev=>{const t=ev.target;if(t.id==="ff"){F.f=t.value;F.lim=30;render(true)}else if(t.dataset.o&&t.tagName==="SELECT"){const o=t.dataset.o==="E"?E:t.dataset.o==="SITE"?SITE:CONF;setP(o,t.dataset.p,t.value)}});
document.addEventListener("focusout",ev=>{const t=ev.target;if(t.dataset&&t.dataset.bli&&t.dataset.k==="v"){const v=t.value;if(/\n\s*\n/.test(v)){const id=t.dataset.bli,i=+t.dataset.i,parts=v.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);const k=BLK[id][i].k;BLK[id].splice(i,1,...parts.map(p=>({k,v:p})));render(true)}}});
(async()=>{if(S.token){await loadAll()}render()})();
</script></body></html>
